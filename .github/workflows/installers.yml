name: Build installers

# One evaluation of the nixvim config produces a portable payload (generated
# config + vendored plugin sources) per install layout. The payload is pure
# data, so everything builds on x86_64-linux and is paired with the matching
# official Neovim release. Nothing installed on the target needs Nix.
on:
  workflow_dispatch:
  push:
    paths:
      - installer/**
      - .github/workflows/installers.yml

permissions:
  contents: read

jobs:
  prepare-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build payloads (generated config + vendored plugin sources)
        run: |
          set +e
          nix build --accept-flake-config --no-link --print-out-paths \
            './installer#packages.x86_64-linux.windowsPayload' \
            './installer#packages.x86_64-linux.posixPayload' > out-paths.txt 2> build.log
          rc=$?
          [ $rc -eq 0 ] || exit $rc
      - name: Stage each install layout
        run: |
          set -eu
          {
            sh ./installer/portable-rewrite.sh "$(sed -n '1p' out-paths.txt)" staging-windows
            sh ./installer/portable-rewrite.sh "$(sed -n '2p' out-paths.txt)" staging-posix
          } 2>&1 | tee -a build.log
          cp ./installer/posix/install.sh staging-posix/
          chmod +x staging-posix/install.sh
          tar -czf windows-staging.tar.gz -C staging-windows .
          tar -czf posix-staging.tar.gz -C staging-posix .
      - name: Surface the build log
        if: failure()
        run: sh ./installer/surface.sh build.log
      - uses: actions/upload-artifact@v5
        with:
          name: windows-staging
          path: windows-staging.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: posix-staging
          path: posix-staging.tar.gz

  # Each bundle is the posix staging tree plus the official Neovim runtime for
  # that platform and arch.
  bundles:
    needs: prepare-payload
    strategy:
      matrix:
        include:
          - name: nixvim-linux-x86_64
            runtime: nvim-linux-x86_64.tar.gz
          - name: nixvim-linux-arm64
            runtime: nvim-linux-arm64.tar.gz
          - name: nixvim-macos-arm64
            runtime: nvim-macos-arm64.tar.gz
          - name: nixvim-macos-x86_64
            runtime: nvim-macos-x86_64.tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: posix-staging
          path: drop
      - name: Add the stock Neovim runtime
        run: |
          set -eu
          mkdir -p bundle/nvim
          tar -xzf drop/posix-staging.tar.gz -C bundle
          curl -fsSLO "https://github.com/neovim/neovim/releases/latest/download/${{ matrix.runtime }}"
          tar -xzf "${{ matrix.runtime }}" -C bundle/nvim --strip-components=1
          tar -czf "${{ matrix.name }}.tar.gz" -C bundle .
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  windows-installer:
    needs: prepare-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: windows-staging
          path: drop
      - name: Unpack payload
        run: |
          New-Item -Force -ItemType Directory installer\windows\staging | Out-Null
          tar -xzf drop\windows-staging.tar.gz -C installer\windows\staging
      - name: Fetch official Neovim win64
        run: |
          $url = "https://github.com/neovim/neovim/releases/latest/download/nvim-win64.zip"
          Invoke-WebRequest $url -OutFile nvim-win64.zip
          Expand-Archive nvim-win64.zip -DestinationPath nvim-tmp
          Move-Item nvim-tmp\nvim-win64 installer\windows\staging\nvim
      # Named so a missing piece is visible from the public job/step listing.
      - name: Require nvim exe config init.lua and plugins in staging
        run: |
          foreach ($p in 'installer\windows\staging\nvim\bin\nvim.exe',
                         'installer\windows\staging\config\init.lua',
                         'installer\windows\staging\plugins') {
            if (-not (Test-Path $p)) { throw "missing: $p" }
          }
      - name: Compile installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\installer.nsi *>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Surface the compiler log
        if: failure()
        shell: bash
        run: sh ./installer/surface.sh build.log
      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-windows
          path: installer\windows\NixvimSetup.exe

  # Installing and loading the config is the only check that a rewritten
  # runtimepath actually resolves on the target platform.
  smoke-linux:
    needs: bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: nixvim-linux-x86_64
          path: drop
      - name: Install the bundle
        run: |
          set -eu
          mkdir bundle
          tar -xzf drop/nixvim-linux-x86_64.tar.gz -C bundle
          sh bundle/install.sh
      - name: Confirm no store paths survived
        run: |
          set -eu
          if grep -rl '/nix/store/' "$HOME/.config/nvim" "$HOME/.nixvim/plugins" > leftovers.txt; then
            cat leftovers.txt
            exit 1
          fi
      - name: Load plugins through the installed config
        run: |
          set -euo pipefail
          "$HOME/.nixvim/nvim/bin/nvim" --headless \
            -c "luafile $GITHUB_WORKSPACE/installer/check.lua" -c "qa!" 2>&1 |
            tee build.log
      - name: Surface the check log
        if: failure()
        run: sh ./installer/surface.sh build.log

  smoke-macos:
    needs: bundles
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: nixvim-macos-arm64
          path: drop
      - name: Install the bundle
        run: |
          set -eu
          mkdir bundle
          tar -xzf drop/nixvim-macos-arm64.tar.gz -C bundle
          sh bundle/install.sh
      - name: Confirm no store paths survived
        run: |
          set -eu
          if grep -rl '/nix/store/' "$HOME/.config/nvim" "$HOME/.nixvim/plugins" > leftovers.txt; then
            cat leftovers.txt
            exit 1
          fi
      - name: Load plugins through the installed config
        run: |
          set -euo pipefail
          "$HOME/.nixvim/nvim/bin/nvim" --headless \
            -c "luafile $GITHUB_WORKSPACE/installer/check.lua" -c "qa!" 2>&1 |
            tee build.log
      - name: Surface the check log
        if: failure()
        run: sh ./installer/surface.sh build.log

  smoke-windows:
    needs: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: nixvim-windows
          path: drop
      - name: Run the installer
        run: Start-Process -Wait -FilePath drop\NixvimSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
      - name: Confirm no store paths survived
        shell: bash
        run: |
          set -eu
          if grep -rl '/nix/store/' "$LOCALAPPDATA/nvim" "$LOCALAPPDATA/nvim-plugins" > leftovers.txt; then
            cat leftovers.txt
            exit 1
          fi
      - name: Load plugins through the installed config
        shell: bash
        run: |
          set -euo pipefail
          # {autopf} resolves under LocalAppData for a lowest-privilege install
          check=$(cygpath -m "$GITHUB_WORKSPACE/installer/check.lua")
          "$LOCALAPPDATA/Programs/Nixvim/nvim-win64/bin/nvim.exe" --headless \
            -c "luafile $check" -c "qa!" 2>&1 | tee build.log
      - name: Surface the check log
        if: failure()
        shell: bash
        run: sh ./installer/surface.sh build.log
