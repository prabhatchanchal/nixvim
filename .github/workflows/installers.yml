name: Build installers

on:
  workflow_dispatch:
  push:
    paths:
      - installer/**
      - .github/workflows/installers.yml

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Bundle nixvim into a self-contained executable
        run: |
          nix bundle --bundler github:NixOS/bundlers#toBZ2 \
            './installer#packages.x86_64-linux.default'
          cp result-bin/* nixvim.x86_64-linux.bin
          chmod +x nixvim.x86_64-linux.bin
      - uses: actions/upload-artifact@v4
        with:
          name: nixvim-x86_64-linux
          path: nixvim.x86_64-linux.bin

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            system: aarch64-darwin
          - runner: macos-13
            system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build nixvim
        run: nix build --no-link --print-out-paths './installer#packages.${{ matrix.system }}.default' > outpath
      - name: Export nix closure into a relocatable archive
        run: |
          mkdir -p archive/store
          nix copy --no-check-sigs --to "file://$(pwd)/archive/store" "$(cat outpath)"
          cat > archive/restore.sh <<'EOF'
          #!/usr/bin/env bash
          # Imports the bundled closure into your local nix store, then prints the nvim path.
          set -euo pipefail
          cd "$(dirname "$0")"
          nix copy --from "file://$(pwd)/store" --to store
          cat outpath.txt
          EOF
          cp outpath archive/outpath.txt
          tar -czf nixvim-${{ matrix.system }}.tar.gz -C archive .
      - uses: actions/upload-artifact@v4
        with:
          name: nixvim-${{ matrix.system }}
          path: nixvim-${{ matrix.system }}.tar.gz

  prepare-windows-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Build payload (generated config + vendored plugin sources)
        run: nix build --no-link --print-out-paths './installer#packages.x86_64-linux.windowsPayload' > payload-path
      - name: Rewrite nix store paths to a local plugin root
        run: |
          set -euo pipefail
          PAYLOAD=$(cat payload-path)
          mkdir -p staging
          cp -r --no-preserve=all "$PAYLOAD/config" staging/
          cp -r --no-preserve=all "$PAYLOAD/plugins" staging/
          jq 'to_entries[] | [.key, .value] | @tsv' -r staging/mapping.json > map.tsv
          PLUGINS_ROOT='C:/ProgramData/Nixvim/plugins'
          find staging -type f -print0 | while IFS= read -r -d '' f; do
            while IFS=$'\t' read -r path name; do
              [ -f "$f" ] || continue
              sed -i "s|$path|$PLUGINS_ROOT/$name|g" "$f"
            done < map.tsv
          done
          tar -czf windows-staging.tar.gz -C staging .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-staging
          path: windows-staging.tar.gz

  windows-installer:
    needs: prepare-windows-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-staging
          path: drop
      - name: Unpack payload
        run: |
          mkdir installer\windows\staging
          tar -xzf drop\windows-staging.tar.gz -C installer\windows\staging
      - name: Fetch official Neovim win64
        run: |
          $ver = (Invoke-RestMethod https://api.github.com/repos/neovim/neovim/releases/latest).tag_name
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/$ver/nvim-win64.zip" -OutFile nvim-win64.zip
          Expand-Archive nvim-win64.zip -DestinationPath installer\windows\
          Move-Item installer\windows\nvim-win64 installer\windows\staging\nvim
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: nixvim-windows
          path: installer\windows\NixvimSetup.exe
