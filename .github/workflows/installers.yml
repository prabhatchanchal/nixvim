name: Build installers

# The portable payloads (generated config + vendored plugin sources) are pure
# data, so every one of them is built from the x86_64-linux evaluation and
# paired with the matching official Neovim release. Nothing installed on the
# target machine needs Nix.
on:
  workflow_dispatch:
  push:
    paths:
      - installer/**
      - .github/workflows/installers.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Bundle nixvim into a self-contained AppImage
        run: |
          set +e
          nix bundle --accept-flake-config --out-link appimage-link \
            --bundler github:NixOS/bundlers#toAppImage \
            './installer#packages.x86_64-linux.default' > build.log 2>&1
          rc=$?
          [ $rc -eq 0 ] || exit $rc
          cp -L appimage-link nixvim.x86_64-linux.AppImage
          chmod +x nixvim.x86_64-linux.AppImage
      - name: Surface the build log
        if: failure()
        run: sh ./installer/surface.sh build.log

      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-x86_64-linux
          path: nixvim.x86_64-linux.AppImage

  prepare-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build payloads (generated config + vendored plugin sources)
        run: |
          set +e
          nix build --accept-flake-config --no-link --print-out-paths \
            './installer#packages.x86_64-linux.windowsPayload' \
            './installer#packages.x86_64-linux.macosPayload' > out-paths.txt 2> build.log
          [ $? -eq 0 ] || exit 1
      - name: Stage each target
        run: |
          set -eu
          {
            sh ./installer/portable-rewrite.sh "$(sed -n '1p' out-paths.txt)" staging-windows
            sh ./installer/portable-rewrite.sh "$(sed -n '2p' out-paths.txt)" staging-macos
          } 2>&1 | tee -a build.log
          cp ./installer/macos/install.sh staging-macos/
          chmod +x staging-macos/install.sh
          tar -czf windows-staging.tar.gz -C staging-windows .
          tar -czf macos-staging.tar.gz -C staging-macos .
      - name: Surface the build log
        if: failure()
        run: sh ./installer/surface.sh build.log

      - uses: actions/upload-artifact@v5
        with:
          name: windows-staging
          path: windows-staging.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: macos-staging
          path: macos-staging.tar.gz

  macos:
    needs: prepare-payload
    strategy:
      matrix:
        # Apple ships one Neovim runtime per arch; the payload is arch-neutral.
        arch:
          - arm64
          - x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: macos-staging
          path: drop
      - name: Add the stock Neovim runtime
        run: |
          set -eu
          mkdir -p staging/nvim
          tar -xzf drop/macos-staging.tar.gz -C staging
          curl -fsSLO "https://github.com/neovim/neovim/releases/latest/download/nvim-macos-${{ matrix.arch }}.tar.gz"
          tar -xzf "nvim-macos-${{ matrix.arch }}.tar.gz" -C staging/nvim --strip-components=1
          tar -czf "nixvim-macos-${{ matrix.arch }}.tar.gz" -C staging .

      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-macos-${{ matrix.arch }}
          path: nixvim-macos-${{ matrix.arch }}.tar.gz

  windows-installer:
    needs: prepare-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: windows-staging
          path: drop
      - name: Unpack payload
        run: |
          New-Item -Force -ItemType Directory installer\windows\staging | Out-Null
          tar -xzf drop\windows-staging.tar.gz -C installer\windows\staging
      - name: Fetch official Neovim win64
        run: |
          $url = "https://github.com/neovim/neovim/releases/latest/download/nvim-win64.zip"
          Invoke-WebRequest $url -OutFile nvim-win64.zip
          Expand-Archive nvim-win64.zip -DestinationPath nvim-tmp
          Move-Item nvim-tmp\nvim-win64 installer\windows\staging\nvim
      # Named so a missing piece is visible from the public job/step listing.
      - name: Require nvim exe config init.lua and plugins in staging
        run: |
          foreach ($p in 'installer\windows\staging\nvim\bin\nvim.exe',
                         'installer\windows\staging\config\init.lua',
                         'installer\windows\staging\plugins') {
            if (-not (Test-Path $p)) { throw "missing: $p" }
          }
      - name: Locate Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Get-ChildItem "${env:ProgramFiles(x86)}" -Filter 'Inno*'
            throw "not found: $iscc"
          }
          Set-Content -Path iscc-path.txt -Value $iscc
      - name: Compile installer
        shell: powershell
        run: |
          & (Get-Content iscc-path.txt) installer\windows\installer.nsi *>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Surface the compiler log
        if: failure()
        shell: bash
        run: sh ./installer/surface.sh build.log

      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-windows
          path: installer\windows\NixvimSetup.exe
