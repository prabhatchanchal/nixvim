name: Build installers

on:
  workflow_dispatch:
  push:
    paths:
      - installer/**
      - .github/workflows/installers.yml

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Bundle nixvim into a self-contained executable
        run: |
          set +e
          out=$(nix bundle --accept-flake-config --out-link appimage-link \
            --bundler github:NixOS/bundlers#toAppImage \
            './installer#packages.x86_64-linux.default' 2>&1)
          rc=$?
          # mirror into the public step summary: job logs require auth
          printf '```\n%s\n```\n' "$out" >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -eq 0 ]; then
            cp -L appimage-link nixvim.x86_64-linux.AppImage
            chmod +x nixvim.x86_64-linux.AppImage
          fi
          exit $rc
      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-x86_64-linux
          path: nixvim.x86_64-linux.AppImage

  macos:
    strategy:
      matrix:
        # Apple Silicon. Intel macs: add { runner: macos-15-intel, system: x86_64-darwin }
        # only after confirming that label is available on this org.
        include:
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build nixvim
        run: nix build --out-link nvim-result './installer#packages.${{ matrix.system }}.default'
      - name: Export nix closure into a relocatable archive
        run: |
          OUT=$(cd nvim-result && pwd -P)
          mkdir -p archive/store
          nix copy --no-check-sigs --to "file://$(pwd)/archive/store" "$OUT"
          cat > archive/restore.sh <<'EOF'
          #!/usr/bin/env bash
          # Imports the bundled closure into your local nix store, then prints the nvim path.
          set -euo pipefail
          cd "$(dirname "$0")"
          nix copy --from "file://$(pwd)/store" --to store
          cat outpath.txt
          EOF
          echo "$OUT/bin/nvim" > archive/outpath.txt
          tar -czf nixvim-${{ matrix.system }}.tar.gz -C archive .
      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-${{ matrix.system }}
          path: nixvim-${{ matrix.system }}.tar.gz

  prepare-windows-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build payload (generated config + vendored plugin sources)
        run: |
          set +e
          out=$(nix build --accept-flake-config --out-link payload-link \
            './installer#packages.x86_64-linux.windowsPayload' 2>&1)
          rc=$?
          { echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Rewrite nix store paths to a local plugin root
        run: |
          set -euo pipefail
          PAYLOAD=$(cd payload-link && pwd -P)
          bash ./installer/windows/rewrite.sh "$PAYLOAD" staging
          tar -czf windows-staging.tar.gz -C staging .
      - uses: actions/upload-artifact@v5
        with:
          name: windows-staging
          path: windows-staging.tar.gz

  windows-installer:
    needs: prepare-windows-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: windows-staging
          path: drop
      - name: Unpack payload
        run: |
          mkdir installer\windows\staging
          tar -xzf drop\windows-staging.tar.gz -C installer\windows\staging
      - name: Fetch official Neovim win64
        run: |
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/latest/download/nvim-win64.zip" -OutFile nvim-win64.zip
          Expand-Archive nvim-win64.zip -DestinationPath installer\windows\
          Move-Item installer\windows\nvim-win64 installer\windows\staging\nvim
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\installer.nsi
      - uses: actions/upload-artifact@v5
        with:
          name: nixvim-windows
          path: installer\windows\NixvimSetup.exe
